[versions]
agp = "9.5.0"
kotlin = "2.4.10"
ksp = "2.3.14"
compose-bom = "2026.11.01"
room = "2.8.5"
navigation3 = "1.2.2"
activity = "1.13.0"
browser = "1.10.0"
lifecycle = "2.11.1"
reorderable = "3.1.0"
test-runner = "1.7.0"
test-junit = "1.3.0"
kotlinflow = "1.0.1"
jgrapht = "1.5.3"
serialization-json = "1.11.0"
okhttp = "5.5.1"
junit = "4.13.2"
miuix = "0.9.5-beta02"
materialkolor = "6.0.0"
benchmark = "1.5.0"
uiautomator = "2.4.1"
markdown = "0.45.0"
recur = "0.17.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
test-activity = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
nav-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
nav-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
kotlinflow = { module = "io.github.joaonart:kotlinflow", version.ref = "kotlinflow" }
jgrapht = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
markdown-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown" }
recur = { module = "org.dmfs:lib-recur", version.ref = "recur" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
materialkolor = { module = "com.materialkolor:material-kolor-core", version.ref = "materialkolor" }
macrobenchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
